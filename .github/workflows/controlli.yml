# A ogni push: test, controllo dei tipi, costruzione del sito e test della
# pagina in tre browser veri: Chromium (Chrome ed Edge), Firefox e WebKit
# (il motore di Safari), ciascuno in un lavoro a parte, in parallelo
# (D-123). L'esito compare accanto al commit.
#
# Gira su ogni ramo. Non blocca nulla da solo: il sito delle classi si
# aggiorna solo con un push sul ramo stabile, che si fa dopo che questi
# controlli sono passati su main (decisioni D-67 e D-99 in SPEC.md).
name: Controlli

on:
  push:
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Test del motore e della logica dell'interfaccia
        run: npm test

      - name: Controllo dei tipi
        run: npm run check

  pagina:
    name: pagina (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Un browser che fallisce non ferma gli altri: si vede subito se il
      # difetto è di uno solo.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Installa il browser dei test
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Test della pagina (costruiscono il sito e lo provano)
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Conserva le tracce dei test falliti
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracce-dei-test-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
